# A symmetry-reduced version of the "full" problem:
# Notice the "0.5" factors in elements A & Iz parameters:


parameters:
  Q: 1000  # External distributed load (N/m)

beam_sections:
- {name: MY_BEAM, E: 2e11, A: 20e-4, Iz: 200e-8}
- {name: MY_BEAM_HALF, E: 2e11, A: 0.5*20e-4, Iz: 0.5*200e-8}
- {name: MY_CABLE, E: 2e11, A: 0.5e-4}

nodes:
- {id: 0, coords: [0, 0]}
- {id: 1, coords: [0, 3]}
- {id: 2, coords: [0, 4]}
- {id: 3, coords: [-2, 3.5]}

elements:
- {type: BEAM2D_RR, nodes: [0, 1], section: MY_BEAM_HALF}
- {type: BEAM2D_RR, nodes: [1, 2], section: MY_BEAM_HALF}
- {type: BEAM2D_RA, nodes: [1, 3], section: MY_BEAM}
- {type: BEAM2D_AA, nodes: [2, 3], section: MY_CABLE}

constraints:
- {node: 0, dof: DXDYRZ}
- {node: 1, dof: DXRZ}
- {node: 2, dof: DXRZ}

element_loads:
- {element: 2, type: DISTRIB_UNIFORM, q: Q, DX: 0, DY: -1, DZ: 0}
- {element: 0, type: TEMPERATURE, deltaT: 30}
- {element: 1, type: TEMPERATURE, deltaT: 30}
