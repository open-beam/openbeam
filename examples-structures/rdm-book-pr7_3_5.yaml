# -------------------------------------------------------
# Example of a FE problem for the OpenBeam library
#
# Problem 7.3.5 in our Strength of Materials book
#
#        https://github.com/open-beam/openbeam
# -------------------------------------------------------

# -------------------------------------------------
#  Parameters
# -------------------------------------------------
#parameters:
#  G: 10         # Newtons (approx 9.8 ~=10)

# -------------------------------------------------
# beam sections
# -------------------------------------------------
beam_sections:
- name: IPN300
  E: 2.0e11     # Young module
  A: 6e-2       # Area (not real value, since it's not used anyway)
  Iz: 9800e-8   # Second moment of area in z

# -------------------------------------------------
#  Geometry: nodes, elements & constraints
# -------------------------------------------------
nodes:
- {id: 0, coords: [0  ,  0], label: A}
- {id: 1, coords: [3/sqrt(2),  3/sqrt(2)], label: B}
- {id: 2, coords: [3/sqrt(2)+3 , 3/sqrt(2)], label: C}

elements:
- {type: BEAM2D_RR, nodes: [0, 1], section: IPN300}
- {type: BEAM2D_RR, nodes: [1, 2], section: IPN300}

# Constraints
constraints:
- {node: 2, dof: DXDYRZ}

# ----------------------------------------------
# Loads
# ----------------------------------------------
#node_loads:
#- {node: 0, dof: DY, value: -P}

element_loads:
- {element: 0, type: DISTRIB_UNIFORM, q: 4000/sqrt(2), DX: 1, DY: 0, DZ: 0}

